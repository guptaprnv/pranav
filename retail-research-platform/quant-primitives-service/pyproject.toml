[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-primitives"
version = "0.1.0"
description = "Deterministic financial computations (alpha, beta, VaR, correlation, drift, concentration) for the Retail Research Platform's Intelligence Layer."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_primitives"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
