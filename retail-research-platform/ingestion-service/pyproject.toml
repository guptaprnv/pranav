[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mf-ingestion"
version = "0.1.0"
description = "Holdings ingestion and AMFI entity resolution for the Retail Research Platform MVP."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mf_ingestion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
