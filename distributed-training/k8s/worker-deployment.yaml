apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-worker
  namespace: dist-training
  labels:
    app: dt-worker
spec:
  replicas: 4           # 4 workers = 4 concurrent training jobs; scale up for 1000 users
  selector:
    matchLabels:
      app: dt-worker
  template:
    metadata:
      labels:
        app: dt-worker
    spec:
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: worker
          image: dist-training-worker:latest
          env:
            - name: REDIS_URL
              value: "redis://redis.dist-training.svc.cluster.local:6379/0"
            - name: LOG_DIR
              value: /logs
            - name: CHECKPOINT_DIR
              value: /checkpoints
            - name: NCCL_DEBUG
              value: WARN
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: logs
              mountPath: /logs
            - name: checkpoints
              mountPath: /checkpoints
            - name: training-data
              mountPath: /data
              readOnly: true
            - name: shm              # Shared memory for PyTorch DataLoader
              mountPath: /dev/shm
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: logs-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoints-pvc
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
