# Medium config — 4 GPUs, multi-node (e.g. 2 Mac minis with eGPUs, or cloud)
# Good for: contributor-tier users, mid-size models

job_name: "medium-training-run"
model_name: "resnet50"
dataset: "imagenet"
data_dir: "/data/imagenet"

num_epochs: 30
batch_size: 64
learning_rate: 1.0e-3
weight_decay: 1.0e-4
max_grad_norm: 1.0
warmup_steps: 500

checkpoint_dir: "/checkpoints"
keep_last_n_checkpoints: 3
save_every_n_epochs: 2
log_every_n_steps: 10

distributed:
  backend: "nccl"
  strategy: "ddp"
  find_unused_parameters: false
  mixed_precision: true
  use_bf16: true

resources:
  gpus_per_node: 2
  num_nodes: 2
  cpus_per_task: 8
  memory_gb: 64
  timeout_hours: 12
